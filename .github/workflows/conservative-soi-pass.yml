name: NorthEdge conservative SOI truth gate
# corrected repository-relative manifest path handling

on:
  push:
    branches:
      - release/northedge-cutover-r1
    paths:
      - .github/workflows/conservative-soi-pass.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/northedge-cutover-r1
          fetch-depth: 0
      - name: Apply conservative truth pass
        run: python tools/conservative-soi-pass.py
      - name: Remove one-time transport
        run: |
          rm -f tools/conservative-soi-pass.py
          rm -f .github/workflows/conservative-soi-pass.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Exact tree gate
        run: |
          git add -A
          TREE=$(git write-tree)
          echo "Final tree: $TREE"
          test "$TREE" = "b5a8b9d4fab0b5812e0679f566511a1f20c44e02"
      - name: Commit verified truth pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: avoid unverified SOI availability claims'
          git push origin HEAD:release/northedge-cutover-r1
