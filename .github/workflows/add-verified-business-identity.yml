name: NorthEdge verified business identity

on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/add-verified-business-identity.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - run: python tools/add-verified-business-identity.py
      - name: Verify identity and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          public=root/'public'
          identity='NORTHEDGE REAL ESTATE PTY LTD · ABN 35 690 949 412'
          html=[p for p in public.glob('*.html') if p.name!='thank-you.html']
          missing=[p.name for p in html if identity not in p.read_text(encoding='utf-8')]
          if missing: raise SystemExit(f'Identity missing from: {missing}')
          old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          exclude={'.github/workflows/add-verified-business-identity.yml','tools/add-verified-business-identity.py'}
          entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or p.as_posix() in exclude: continue
              b=p.read_bytes();entries.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'release':'NorthEdge Cutover R1 — Cloudflare-ready candidate','date':'2026-08-09','baseRelease':old.get('baseRelease','NorthEdge R3'),'baseSha256':old.get('baseSha256','7003c5932d9b96ed5113c93008578b990a50c490f8d5e985f587396372d3cb1c'),'fileCount':len(entries)+1,'files':entries}
          if manifest['fileCount']!=179: raise SystemExit(f'Unexpected final file count {manifest["fileCount"]}')
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Remove one-time transport
        run: |
          rm -f tools/add-verified-business-identity.py
          rm -f .github/workflows/add-verified-business-identity.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit verified identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: publish verified NorthEdge legal entity and ABN'
          git push origin HEAD:cutover/legacy-routing-preview
