name: NorthEdge apply accessibility contrast correction
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/apply-a11y-contrast.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Apply correction
        run: python tools/fix-a11y-contrast.py
      - name: Regenerate manifest and clean temporary QA transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          exclude={
            'tools/fix-a11y-contrast.py',
            '.github/workflows/apply-a11y-contrast.yml',
            'functions/api/_qa-migrate.js',
            '.github/workflows/preview-e2e.yml',
            '.github/workflows/preview-e2e-v2.yml',
            '.github/workflows/preview-e2e-v3.yml',
            '.github/workflows/legacy-debug.yml',
            '.github/workflows/http-debug.yml',
            '.github/workflows/axe-detail.yml',
            '.github/workflows/axe-detail-v2.yml',
          }
          old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          entries=[]
          for p in sorted(root.rglob('*')):
              rel=p.as_posix()
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or rel in exclude: continue
              b=p.read_bytes();entries.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'release':'NorthEdge Cutover R1 — Cloudflare-ready candidate','date':'2026-08-09','baseRelease':old.get('baseRelease','NorthEdge R3'),'baseSha256':old.get('baseSha256'),'fileCount':len(entries)+1,'files':entries}
          assert manifest['fileCount']==179,manifest['fileCount']
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f tools/fix-a11y-contrast.py functions/api/_qa-migrate.js
          rm -f .github/workflows/apply-a11y-contrast.yml .github/workflows/preview-e2e.yml .github/workflows/preview-e2e-v2.yml .github/workflows/preview-e2e-v3.yml .github/workflows/legacy-debug.yml .github/workflows/http-debug.yml .github/workflows/axe-detail.yml .github/workflows/axe-detail-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: meet WCAG contrast on About title accents'
          git push origin HEAD:cutover/legacy-routing-preview
