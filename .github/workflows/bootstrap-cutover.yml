name: Bootstrap verified NorthEdge Cutover R1
on:
  push:
    branches: [release/northedge-cutover-r1]
    paths: ['.github/workflows/bootstrap-cutover.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify exact Cutover R1 tree
        run: python tools/bootstrap-compact.py
# trigger after corrected verified payload segments
