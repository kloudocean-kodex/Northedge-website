name: NorthEdge post-truth Cloudflare smoke
on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/post-truth-smoke.yml
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE: https://cutover-legacy-routing-previ.northedge-website.pages.dev
      EXPECTED_CLEAN_TREE: 1d9a07e9fda3acb043570c96136cf4fec32e834f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Wait for exact content state on Cloudflare
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "$BASE/" || true)
            if printf '%s' "$body" | grep -q 'Four current homes.' && ! printf '%s' "$body" | grep -q '105 Tungsten Drive' && ! printf '%s' "$body" | grep -q '6 Alisterus Road'; then
              echo 'Cloudflare branch preview is serving the reconciled campaign state.'
              exit 0
            fi
            sleep 6
          done
          echo 'Cloudflare preview did not converge to the reconciled campaign state.' >&2
          exit 1
      - name: HTTP, sitemap, archival and security smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, xml.etree.ElementTree as ET
          base='https://cutover-legacy-routing-previ.northedge-website.pages.dev'
          root=ET.parse('public/sitemap.xml').getroot();locs=[n.text for n in root.iter() if n.tag.endswith('loc')]
          assert len(locs)==26,len(locs)
          for loc in locs:
              path='/' + loc.split('/',3)[-1] if loc.count('/')>=3 else '/'
              if loc.rstrip('/')=='https://northedgerealestate.com.au':path='/'
              code=subprocess.check_output(['curl','-sS','-o','/dev/null','-w','%{http_code}',base+path],text=True).strip()
              assert code=='200',(path,code)
          for path in ['/property-105-tungsten-drive-kalkallo','/property-6-alisterus-road-kalkallo']:
              body=subprocess.check_output(['curl','-fsS',base+path],text=True)
              assert 'noindex,follow' in body,path
              assert 'data-gallery-open' not in body,path
              assert 'Not a current NorthEdge campaign' in body or 'No current NorthEdge campaign' in body,path
          body=subprocess.check_output(['curl','-fsS',base+'/'],text=True)
          assert body.count('<article class="property-card')==4
          assert '105 Tungsten Drive' not in body and '6 Alisterus Road' not in body
          hdr=subprocess.check_output(['curl','-sSI',base+'/'],text=True).lower()
          for name in ['content-security-policy:','x-content-type-options:','x-frame-options:','referrer-policy:','permissions-policy:']:
              assert name in hdr,name
          deep=subprocess.check_output(['curl','-sS','-o','/dev/null','-w','%{http_code}',base+'/qa/deep/not-a-real-page'],text=True).strip();assert deep=='404',deep
          print('HTTP/sitemap/archive/security smoke PASS: 26 sitemap routes')
          PY
      - name: Install test-only accessibility tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.54.2 axe-core@4.10.2 >/dev/null
      - name: Browser accessibility and interaction regression
        run: |
          cat > post-truth-smoke.cjs <<'NODE'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const BASE=process.env.BASE;
          const paths=[...fs.readFileSync('public/sitemap.xml','utf8').matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>new URL(m[1]).pathname||'/');
          paths.push('/property-105-tungsten-drive-kalkallo','/property-6-alisterus-road-kalkallo');
          const axe=fs.readFileSync(require.resolve('axe-core/axe.min.js'),'utf8');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000},bypassCSP:true});
            const page=await ctx.newPage(); const failures=[]; const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            for(const path of paths){
              const r=await page.goto(BASE+path,{waitUntil:'networkidle',timeout:30000});
              if(!r||r.status()!==200){failures.push({path,http:r?.status()});continue}
              await page.addScriptTag({content:axe});
              const a=await page.evaluate(()=>axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']}}));
              const severe=a.violations.filter(v=>['serious','critical'].includes(v.impact));
              if(severe.length)failures.push({path,violations:severe.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>n.target)}))});
            }
            await page.setViewportSize({width:390,height:844});await page.goto(BASE+'/',{waitUntil:'networkidle'});
            const mobile=page.locator('[data-mobile-nav]');if((await mobile.getAttribute('inert'))===null)failures.push({path:'/',interaction:'closed menu missing inert'});
            for(let i=0;i<12;i++){await page.keyboard.press('Tab');const inside=await page.evaluate(()=>document.querySelector('[data-mobile-nav]')?.contains(document.activeElement));if(inside){failures.push({path:'/',interaction:'closed mobile nav accepted keyboard focus'});break}}
            await page.locator('[data-menu-toggle]').click();if((await mobile.getAttribute('inert'))!==null)failures.push({path:'/',interaction:'open menu still inert'});
            await page.setViewportSize({width:1440,height:1000});await page.goto(BASE+'/',{waitUntil:'networkidle'});const search=page.locator('form[data-property-search]');const journey=search.locator('[name="journey"]');await journey.selectOption('rent');await search.evaluate(el=>el.requestSubmit());await page.waitForURL(/\/rent(?:#rent-register)?$/,{timeout:10000});
            if(!page.url().includes('/rent'))failures.push({path:'/',interaction:'Rent search did not route to rent'});
            await browser.close();
            console.log(JSON.stringify({testedRoutes:paths.length,failures,pageErrors},null,2));
            if(failures.length||pageErrors.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node post-truth-smoke.cjs
      - name: Remove QA transport and prove exact clean tree
        if: always()
        run: |
          rm -f .github/workflows/post-truth-smoke.yml post-truth-smoke.cjs
          rm -rf node_modules package.json package-lock.json
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          TREE=$(git write-tree)
          echo "Restored clean tree: $TREE"
          test "$TREE" = "$EXPECTED_CLEAN_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa: pass post-truth Cloudflare smoke and restore clean candidate'
          git push origin HEAD:cutover/legacy-routing-preview
