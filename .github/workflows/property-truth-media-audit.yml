name: NorthEdge property truth reconciliation
on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/property-truth-media-audit.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Apply and verify current-campaign reconciliation
        run: python tools/reconcile-current-campaigns.py
      - name: Remove temporary transport and commit clean candidate
        run: |
          rm -f .github/workflows/property-truth-media-audit.yml tools/reconcile-current-campaigns.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile current campaigns and property media readiness'
          git push origin HEAD:cutover/legacy-routing-preview
