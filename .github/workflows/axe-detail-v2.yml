name: NorthEdge axe detail v2
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/axe-detail-v2.yml]
jobs:
  detail:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact contrast nodes
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.54.2 axe-core@4.10.2 >/dev/null
          cat > detail.cjs <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});const c=await b.newContext({viewport:{width:1440,height:1000},bypassCSP:true});const p=await c.newPage();await p.goto('https://cutover-legacy-routing-previ.northedge-website.pages.dev/about',{waitUntil:'networkidle'});await p.addScriptTag({path:require.resolve('axe-core/axe.min.js')});const r=await p.evaluate(()=>axe.run(document,{runOnly:{type:'rule',values:['color-contrast']}}));console.log(JSON.stringify(r.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,html:n.html,failureSummary:n.failureSummary,data:n.any.map(x=>x.data)}))})),null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node detail.cjs
