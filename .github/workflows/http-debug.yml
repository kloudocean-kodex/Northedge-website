name: NorthEdge HTTP diagnostic

on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/http-debug.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 404, assets and headers
        shell: bash
        env:
          BASE: https://cutover-legacy-routing-previ.northedge-website.pages.dev
        run: |
          set -u
          sleep 8
          code=$(curl -sS -o deep404.html -D deep404.headers -w '%{http_code}' "$BASE/qa/deep/definitely-missing")
          echo "deep404 status=$code"
          echo '--- deep404 headers ---'; cat deep404.headers
          echo '--- deep404 asset refs ---'; grep -oE '(href|src)="[^"]+"' deep404.html | head -30 || true
          for asset in /assets/css/site.css /assets/images/logo-640.png /assets/images/donnybrook-living-960.jpg; do
            result=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' "$BASE$asset")
            echo "$asset => $result"
          done
          curl -sS "$BASE/" -D home.headers -o /dev/null
          echo '--- home headers ---'; cat home.headers
          fail=0
          [ "$code" = 404 ] || fail=1
          grep -q 'href="/assets/css/site.css"' deep404.html || { echo 'missing root CSS ref'; fail=1; }
          grep -q 'src="/assets/images/logo-640.png"' deep404.html || { echo 'missing root logo ref'; fail=1; }
          grep -qi '^x-content-type-options: nosniff' home.headers || { echo 'missing nosniff'; fail=1; }
          grep -qi '^x-frame-options: DENY' home.headers || { echo 'missing frame deny'; fail=1; }
          grep -qi '^content-security-policy:' home.headers || { echo 'missing CSP'; fail=1; }
          grep -qi '^x-robots-tag: noindex, nofollow' home.headers || { echo 'missing preview noindex'; fail=1; }
          exit $fail
