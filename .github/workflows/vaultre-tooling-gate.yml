name: NorthEdge VaultRE tooling gate
on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/vaultre-tooling-gate.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Freeze tested public tree
        run: |
          PUBLIC_TREE=$(git rev-parse HEAD:public)
          echo "PUBLIC_TREE=$PUBLIC_TREE" >> "$GITHUB_ENV"
          echo "Public tree before tooling validation: $PUBLIC_TREE"
      - name: Validate VaultRE sync utility and secret hygiene
        run: |
          python -m py_compile tools/vaultre_media_sync.py
          python tools/vaultre_media_sync.py --help >/dev/null
          rm -rf tools/__pycache__
          grep -q '^VAULTRE_API_KEY=$' .env.example
          grep -q '^VAULTRE_ACCESS_TOKEN=$' .env.example
          grep -q '^\.vaultre-cache/$' .gitignore
          ! grep -R -E 'VAULTRE_(API_KEY|ACCESS_TOKEN)=.+$' --exclude='.env.example' --exclude='vaultre-tooling-gate.yml' .
      - name: Regenerate release manifest
        run: |
          rm -f .github/workflows/vaultre-tooling-gate.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.');old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'));entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json':continue
              b=p.read_bytes();entries.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out={k:old.get(k) for k in ['release','baseRelease','baseSha256'] if old.get(k) is not None}
          out['date']='2026-08-10';out['fileCount']=len(entries)+1;out['files']=entries
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Release files:',out['fileCount'])
          assert out['fileCount']==183,out['fileCount']
          PY
      - name: Prove public deployment content unchanged and commit clean tooling state
        run: |
          NOW=$(git rev-parse HEAD:public)
          echo "Public tree after tooling changes: $NOW"
          test "$NOW" = "$PUBLIC_TREE"
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: validate VaultRE media sync tooling and manifest'
          git push origin HEAD:cutover/legacy-routing-preview
