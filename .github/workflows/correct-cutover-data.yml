name: NorthEdge Cutover R1 data correction

on:
  push:
    branches:
      - release/northedge-cutover-r1
    paths:
      - .github/workflows/correct-cutover-data.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/northedge-cutover-r1
          fetch-depth: 0

      - name: Apply deterministic corrections
        run: python tools/correct-cutover-data.py

      - name: Regenerate release manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('.')
          old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or p.as_posix() in {'.github/workflows/correct-cutover-data.yml','tools/correct-cutover-data.py'}:
                  continue
              b=p.read_bytes()
              entries.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={
              'release':old.get('release','NorthEdge Cutover R1'),
              'date':old.get('date','2026-08-08'),
              'baseRelease':old.get('baseRelease','NorthEdge R3'),
              'baseSha256':old.get('baseSha256','7003c5932d9b96ed5113c93008578b990a50c490f8d5e985f587396372d3cb1c'),
              'fileCount':len(entries)+1,
              'files':entries,
          }
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if manifest['fileCount'] != 176 or len(entries) != 175:
              raise SystemExit(f'Unexpected release file count: {manifest["fileCount"]}/{len(entries)}')
          PY

      - name: Remove one-time correction transport
        run: |
          rm -f tools/correct-cutover-data.py
          rm -f .github/workflows/correct-cutover-data.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Verify exact final tree
        run: |
          git add -A
          TREE=$(git write-tree)
          echo "Final tree: $TREE"
          test "$TREE" = "865236518d9ad221ed52300cedee326eee5bf222"

      - name: Commit verified corrected release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verify current NorthEdge campaign data'
          git push origin HEAD:release/northedge-cutover-r1
