name: NorthEdge replacement preview E2E

on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/preview-e2e.yml

permissions:
  contents: write

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://cutover-legacy-routing-previ.northedge-website.pages.dev
      QA_KEY: 2026-08-09-cutover-r1
      BATCH: run-${{ github.run_id }}
      EXPECTED_CLEAN_TREE: 1bd2b929ffe0dbf48501df808b653afc3137e093
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0

      - name: Wait for this branch deployment and migrate D1 safely
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/api/_qa-migrate?qa=$QA_KEY&action=migrate" -o migrate.json; then
              if python - <<'PY'
          import json
          d=json.load(open('migrate.json'))
          assert d.get('ok') is True and d.get('schemaHealthy') is True
          assert set(d.get('tables',[])) >= {'leads','lead_rate_limits'}
          assert int(d.get('leadCount',0)) >= 15
          print('D1 migration/schema OK; preserved lead count:', d['leadCount'])
          PY
              then ok=1; break; fi
            fi
            echo "Waiting for current Cloudflare branch deployment ($i/60)..."
            sleep 5
          done
          test "$ok" = 1
          python - <<'PY'
          import json
          d=json.load(open('migrate.json'))
          open('baseline-count.txt','w').write(str(int(d['leadCount'])))
          PY

      - name: Verify health, headers, sitemap routes and redirects
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE/api/health" -D health.headers -o health.json
          python - <<'PY'
          import json
          d=json.load(open('health.json'))
          assert d['ok'] is True
          assert d['leadDatabase'] is True
          assert d['leadDatabaseHealthy'] is True
          assert d['leadSchemaHealthy'] is True
          print('Health:', d)
          PY
          grep -qi '^x-content-type-options: nosniff' health.headers
          grep -qi '^x-frame-options: DENY' health.headers
          grep -qi '^content-security-policy:' health.headers
          grep -qi '^x-robots-tag: noindex, nofollow' health.headers

          python - <<'PY' > routes.txt
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          text=Path('public/sitemap.xml').read_text()
          paths=[urlparse(x).path or '/' for x in re.findall(r'<loc>(.*?)</loc>',text)]
          assert len(paths)==28, len(paths)
          for p in paths: print(p)
          PY
          while IFS= read -r path; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")
            test "$code" = 200 || { echo "Route failed $path => $code"; exit 1; }
          done < routes.txt

          for path in /buy /rent /sell /sold /areas /about /contact; do
            result=$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code} %{url_effective}' "$BASE$path")
            echo "$path => $result"
            test "${result%% *}" = 200
          done
          for path in /buy.html /rent.html /sell.html /sold.html /areas.html /about.html /contact.html; do
            result=$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code} %{url_effective}' "$BASE$path")
            echo "$path => $result"
            test "${result%% *}" = 200
          done

          declare -A LEGACY=(
            ['/about-us/']='/about'
            ['/contacts/']='/contact'
            ['/appraisal/']='/sell#appraisal'
            ['/property-rullinga-road-donnybrook.html']='/property-7-rulingia-road-donnybrook'
            ['/property-mathoura-road-mickleham.html']='/property-6-mathoura-road-mickleham'
          )
          for src in "${!LEGACY[@]}"; do
            code=$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code}' "$BASE$src")
            test "$code" = 200 || { echo "Legacy redirect failed $src"; exit 1; }
          done
          code=$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code}' "$BASE/my-properties-main/?r=available&v=residential&x=sale")
          test "$code" = 200
          code=$(curl -sS -L --max-redirs 8 -o /dev/null -w '%{http_code}' "$BASE/property-listing-details/?v=41733004&type=sale")
          test "$code" = 200

          code=$(curl -sS -o deep404.html -w '%{http_code}' "$BASE/qa/deep/definitely-missing")
          test "$code" = 404
          grep -q 'href="/assets/css/site.css"' deep404.html
          grep -q 'src="/assets/images/logo-640.png"' deep404.html
          curl -fsS "$BASE/assets/css/site.css" -o /dev/null
          curl -fsS "$BASE/assets/images/logo-640.png" -o /dev/null
          curl -fsS "$BASE/assets/images/donnybrook-living-960.jpg" -o /dev/null

          curl -fsS "$BASE/" -D home.headers -o home.html
          grep -qi '^x-content-type-options: nosniff' home.headers
          grep -qi '^x-frame-options: DENY' home.headers
          grep -qi '^content-security-policy:' home.headers
          grep -qi '^x-robots-tag: noindex, nofollow' home.headers

      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.54.2 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium

      - name: Browser, forms, mobile, accessibility and console QA
        shell: bash
        run: |
          cat > /tmp/northedge-e2e.cjs <<'NODE'
          const { chromium } = require('playwright');
          const { AxeBuilder } = require('@axe-core/playwright');
          const fs = require('fs');
          const assert = require('assert');

          const BASE=process.env.BASE;
          const BATCH=process.env.BATCH;
          const xml=fs.readFileSync('public/sitemap.xml','utf8');
          const paths=[...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>new URL(m[1]).pathname||'/');
          if(paths.length!==28) throw new Error(`Expected 28 sitemap routes, got ${paths.length}`);

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          let consoleErrors=[];
          const page=await context.newPage();
          page.on('console',m=>{if(m.type()==='error') consoleErrors.push(`${page.url()}: ${m.text()}`)});
          page.on('pageerror',e=>consoleErrors.push(`${page.url()}: ${e.message}`));

          // Every sitemap route: browser load + serious/critical WCAG smoke check.
          for(const path of paths){
            const response=await page.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:30000});
            assert(response && response.status()===200,`${path} browser HTTP ${response?.status()}`);
            const results=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']).analyze();
            const severe=results.violations.filter(v=>['serious','critical'].includes(v.impact));
            if(severe.length) throw new Error(`Axe severe violations on ${path}: ${severe.map(v=>v.id).join(', ')}`);
          }

          // Discover and submit every physical public lead form using clearly marked QA data.
          let formCount=0,seq=0;
          for(const path of paths){
            await page.goto(BASE+path,{waitUntil:'domcontentloaded'});
            const count=await page.locator('form[data-lead-form]').count();
            for(let i=0;i<count;i++){
              formCount++;seq++;
              const form=page.locator('form[data-lead-form]').nth(i);
              const formId=await form.getAttribute('data-lead-form');
              const email=`qa-northedge-preview-${BATCH}-${String(seq).padStart(2,'0')}@example.com`;
              const controls=form.locator('input,textarea,select');
              const n=await controls.count();
              for(let j=0;j<n;j++){
                const el=controls.nth(j);
                const tag=await el.evaluate(e=>e.tagName.toLowerCase());
                const type=(await el.getAttribute('type')||'').toLowerCase();
                const name=await el.getAttribute('name');
                const required=await el.getAttribute('required')!==null;
                if(type==='hidden'||type==='submit'||type==='button'||type==='text'&&name==='website') continue;
                if(type==='checkbox') { if(required) await el.check(); continue; }
                if(type==='radio') { if(required && !(await form.locator(`input[type=radio][name="${name}"]:checked`).count())) await el.check(); continue; }
                if(tag==='select'){
                  if(required && !(await el.inputValue())){
                    const values=await el.locator('option').evaluateAll(opts=>opts.map(o=>o.value).filter(Boolean));
                    if(values.length) await el.selectOption(values[0]);
                  }
                  continue;
                }
                if(!required && !['address','property_context','message'].includes(name||'')) continue;
                let value='QA TEST — NorthEdge preview regression';
                if(name==='email'||name==='referrer_email') value=email;
                else if(name==='phone'||name==='referrer_phone') value='0400000000';
                else if(name==='name'||name==='referrer_name') value=`QA TEST ${formId}`;
                else if(name==='address') value='QA TEST — 1 Example Street, Mickleham VIC 3064';
                else if(type==='number') value='1';
                await el.fill(value);
              }
              const responsePromise=page.waitForResponse(r=>r.url().includes('/api/leads')&&r.request().method()==='POST',{timeout:20000});
              await form.locator('button[type="submit"],input[type="submit"]').first().click();
              const resp=await responsePromise;
              assert([201,202].includes(resp.status()),`${formId} response ${resp.status()}`);
              const body=await resp.json();
              assert(body.ok===true && body.stored===true,`${formId} was not stored`);
              const statusText=await form.locator('[data-form-status]').textContent();
              assert(/stored|received|sent/i.test(statusText||''),`${formId} missing truthful success status`);
            }
          }
          assert(formCount===14,`Expected 14 physical lead forms; found ${formCount}`);

          // Homepage Rent journey must not route to Buy.
          await page.goto(BASE+'/',{waitUntil:'domcontentloaded'});
          await page.selectOption('[data-property-search] select[name="journey"]','rent');
          await Promise.all([
            page.waitForURL(u=>u.pathname==='/rent'&&u.hash==='#rent-register',{timeout:10000}),
            page.locator('[data-property-search] button[type="submit"]').click()
          ]);

          // Donnybrook lightbox must load the real image.
          await page.goto(BASE+'/property-7-rulingia-road-donnybrook',{waitUntil:'domcontentloaded'});
          const galleryButtons=page.locator('[data-gallery-open]');
          assert(await galleryButtons.count()>=2,'Donnybrook gallery missing second image');
          await galleryButtons.nth(1).click();
          const lb=page.locator('[data-lightbox] img');
          await lb.waitFor({state:'visible'});
          const src=await lb.getAttribute('src');
          assert(src&&src.includes('donnybrook-living-960.jpg'),`Unexpected Donnybrook lightbox src ${src}`);
          await page.waitForFunction(()=>{const i=document.querySelector('[data-lightbox] img');return i&&i.complete&&i.naturalWidth>0});

          // Closed mobile menu must be inert; opening restores keyboard navigation.
          const mobileContext=await browser.newContext({viewport:{width:390,height:844}});
          const mobilePage=await mobileContext.newPage();
          await mobilePage.goto(BASE+'/',{waitUntil:'domcontentloaded'});
          assert(await mobilePage.locator('[data-mobile-nav]').getAttribute('inert')!==null,'Closed mobile menu is not inert');
          for(let i=0;i<15;i++){
            await mobilePage.keyboard.press('Tab');
            const inside=await mobilePage.evaluate(()=>!!document.activeElement?.closest?.('[data-mobile-nav]'));
            assert(!inside,'Keyboard focus entered closed mobile menu');
          }
          await mobilePage.locator('[data-menu-toggle]').click();
          assert(await mobilePage.locator('[data-mobile-nav]').getAttribute('inert')===null,'Open mobile menu remained inert');
          await mobilePage.keyboard.press('Tab');
          assert(await mobilePage.evaluate(()=>!!document.activeElement?.closest?.('[data-mobile-nav]')),'Keyboard did not enter open mobile menu');
          await mobilePage.keyboard.press('Escape');
          assert(await mobilePage.locator('[data-mobile-nav]').getAttribute('inert')!==null,'Mobile menu did not become inert after Escape');
          await mobileContext.close();

          // Deep 404 must retain logo/styles and true 404 status.
          const deep=await page.goto(BASE+'/qa/deep/browser-missing',{waitUntil:'domcontentloaded'});
          assert(deep.status()===404,`Deep 404 returned ${deep.status()}`);
          const logo=page.locator('img[alt="NorthEdge Real Estate"]').first();
          assert(await logo.evaluate(i=>i.complete&&i.naturalWidth>0),'Deep 404 logo did not load');
          const styleHref=await page.locator('link[href="/assets/css/site.css"]').count();
          assert(styleHref>0,'Deep 404 does not use root-relative stylesheet');

          // JavaScript-disabled fallback: real POST, 303->thank-you, same D1 store.
          const noJs=await browser.newContext({javaScriptEnabled:false,viewport:{width:1280,height:900}});
          const noJsPage=await noJs.newPage();
          await noJsPage.goto(BASE+'/contact',{waitUntil:'domcontentloaded'});
          const nf=noJsPage.locator('form[data-lead-form="contact"]').first();
          seq++;
          await nf.locator('input[name="name"]').fill('QA TEST no-JS contact');
          await nf.locator('input[name="email"]').fill(`qa-northedge-preview-${BATCH}-${String(seq).padStart(2,'0')}@example.com`);
          await nf.locator('input[name="phone"]').fill('0400000000');
          await Promise.all([
            noJsPage.waitForURL(u=>u.pathname==='/thank-you',{timeout:15000}),
            nf.locator('button[type="submit"],input[type="submit"]').first().click()
          ]);
          await noJs.close();

          if(consoleErrors.length) throw new Error(`Console/page errors: ${consoleErrors.join(' | ')}`);
          fs.writeFileSync('browser-summary.json',JSON.stringify({routes:paths.length,physicalForms:formCount,totalSubmissions:seq,consoleErrors},null,2));
          await context.close();
          await browser.close();
          NODE
          node /tmp/northedge-e2e.cjs
          cat browser-summary.json

      - name: Verify D1 rows then clean only this QA batch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$BASE/api/_qa-migrate?qa=$QA_KEY&action=batch&batch=$BATCH" -o batch.json
          cat batch.json
          python - <<'PY'
          import json
          d=json.load(open('batch.json'))
          assert d['ok'] is True
          assert d['total']==15, d
          assert len(d['forms'])==11, d
          assert sum(x['count'] for x in d['forms'])==15
          assert any(x['form']=='referral' for x in d['forms'])
          PY
          curl -fsS -X POST "$BASE/api/_qa-migrate?qa=$QA_KEY&action=cleanup&batch=$BATCH" -o cleanup.json
          cat cleanup.json
          python - <<'PY'
          import json
          d=json.load(open('cleanup.json'))
          assert d['ok'] is True and d['deleted']==15 and d['remaining']==0, d
          PY
          curl -fsS "$BASE/api/_qa-migrate?qa=$QA_KEY&action=migrate" -o after.json
          python - <<'PY'
          import json
          baseline=int(open('baseline-count.txt').read())
          d=json.load(open('after.json'))
          assert d['ok'] is True and d['schemaHealthy'] is True
          assert d['leadCount']==baseline,(baseline,d)
          print('Original QA/lead rows preserved:',baseline)
          PY

      - name: Lighthouse performance and accessibility lab gate
        shell: bash
        run: |
          set -euo pipefail
          npx lighthouse "$BASE/" --quiet --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,best-practices --output=json --output-path=lighthouse.json
          python - <<'PY'
          import json
          d=json.load(open('lighthouse.json'))
          c=d['categories'];a=d['audits']
          scores={k:round(v['score']*100) for k,v in c.items()}
          print('Lighthouse scores:',scores)
          assert c['performance']['score']>=0.80,scores
          assert c['accessibility']['score']>=0.95,scores
          assert c['best-practices']['score']>=0.90,scores
          lcp=a['largest-contentful-paint']['numericValue'];cls=a['cumulative-layout-shift']['numericValue'];tbt=a['total-blocking-time']['numericValue']
          print('Lab metrics:',{'LCP_ms':lcp,'CLS':cls,'TBT_ms':tbt})
          assert lcp<=3000,lcp
          assert cls<=0.10,cls
          assert tbt<=300,tbt
          PY

      - name: Remove QA transport and prove final source tree unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -f functions/api/_qa-migrate.js
          rm -f .github/workflows/preview-e2e.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          TREE=$(git write-tree)
          echo "Clean final tree: $TREE"
          test "$TREE" = "$EXPECTED_CLEAN_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'qa: pass NorthEdge replacement preview and remove QA transport'
          git push origin HEAD:cutover/legacy-routing-preview
