name: NorthEdge apply shared accessibility tokens
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/a11y-all-routes.yml]
permissions:
  contents: write
jobs:
  apply-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Apply shared production accessibility correction
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('public/assets/css/final-demo.css')
          s=css.read_text(encoding='utf-8')
          marker='/* Production QA: shared accessible light-form tokens */'
          block='''/* Production QA: shared accessible light-form tokens */
.light-form .form-field label,
.enquiry-card .form-field label{
  color:#3F4742!important;
}
.page-rent .content-section .section-title em{
  color:#815B25;
}'''
          if marker not in s:
              s=s.rstrip()+'\n\n'+block+'\n'
          css.write_text(s,encoding='utf-8')
          qa=Path('docs/QA_REPORT.md')
          q=qa.read_text(encoding='utf-8')
          note='''## Shared form contrast correction — 9 August 2026

A full-route Cloudflare preview sweep showed the same low-contrast label token on light forms and property enquiry cards, plus one Rent section title accent. The shared light-form/enquiry-card label colour is now `#3F4742` and the affected Rent light-surface accent uses `#815B25`. These are shared design-token corrections rather than page-by-page exceptions. A deployment-synchronised 28-route accessibility sweep is required after this change.'''
          if '## Shared form contrast correction — 9 August 2026' not in q:
              q=q.rstrip()+'\n\n'+note+'\n'
          else:
              q=q.rstrip()+'\n'
          qa.write_text(q,encoding='utf-8')
          PY
      - name: Regenerate release manifest without QA transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('.')
          old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          exclude={'.github/workflows/a11y-all-routes.yml'}
          entries=[]
          for p in sorted(root.rglob('*')):
              rel=p.as_posix()
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or rel in exclude:
                  continue
              b=p.read_bytes();entries.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={k:old[k] for k in ['release','date','baseRelease','baseSha256'] if k in old}
          manifest['fileCount']=len(entries)+1;manifest['files']=entries
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Release files:',manifest['fileCount'])
          PY
      - name: Remove one-time workflow and commit clean candidate
        run: |
          rm -f .github/workflows/a11y-all-routes.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply shared accessible form and rent tokens'
          git push origin HEAD:cutover/legacy-routing-preview
