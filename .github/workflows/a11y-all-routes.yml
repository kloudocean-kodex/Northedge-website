name: NorthEdge remove form label opacity regression
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/a11y-all-routes.yml]
permissions:
  contents: write
jobs:
  correct-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Correct label opacity at production layer
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('public/assets/css/final-demo.css')
          s=css.read_text(encoding='utf-8').rstrip()
          marker='/* Production QA: form-label opacity correction */'
          block='/* Production QA: form-label opacity correction */\n.form-field label,.field label{opacity:1!important}'
          if marker not in s:s += '\n\n'+block
          css.write_text(s+'\n',encoding='utf-8')
          qa=Path('docs/QA_REPORT.md');q=qa.read_text(encoding='utf-8').rstrip()
          note='## Form-label opacity correction — 9 August 2026\n\nThe all-route Cloudflare axe sweep traced the remaining label contrast failure to the base `site.css` rule `opacity:.72`. The accessible foreground colour was therefore being alpha-blended back toward the light form background. The production override now sets form/search labels to full opacity; dark appraisal labels retain their intended translucency through their explicit RGBA colour.'
          if '## Form-label opacity correction — 9 August 2026' not in q:q += '\n\n'+note
          qa.write_text(q+'\n',encoding='utf-8')
          PY
      - name: Regenerate manifest and remove QA transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('.');old=json.loads((root/'RELEASE_MANIFEST.json').read_text())
          entries=[]
          for p in sorted(root.rglob('*')):
            rel=p.as_posix()
            if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or rel=='.github/workflows/a11y-all-routes.yml':continue
            b=p.read_bytes();entries.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          m={k:old[k] for k in ['release','date','baseRelease','baseSha256'] if k in old};m['fileCount']=len(entries)+1;m['files']=entries
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f .github/workflows/a11y-all-routes.yml
          rmdir .github/workflows 2>/dev/null || true; rmdir .github 2>/dev/null || true
          git add -A;git diff --cached --check
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove form label opacity regression';git push origin HEAD:cutover/legacy-routing-preview
