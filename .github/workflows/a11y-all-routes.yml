name: NorthEdge correct base form label contrast
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/a11y-all-routes.yml]
permissions:
  contents: write
jobs:
  correct-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Correct production form-label token
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('public/assets/css/final-demo.css')
          s=css.read_text(encoding='utf-8')
          old='.form-field label,.field label{color:#5F6560!important}'
          new='.form-field label,.field label{color:#3F4742!important}'
          if old not in s and new not in s:
              raise SystemExit('Base form label token not found')
          s=s.replace(old,new,1)
          css.write_text(s,encoding='utf-8')
          qa=Path('docs/QA_REPORT.md')
          q=qa.read_text(encoding='utf-8').rstrip()
          note='## Base form-label contrast correction — 9 August 2026\n\nThe deployment-synchronised 28-route axe sweep proved the previous selector was too narrow: several light forms do not carry `.light-form`. The base `.form-field label,.field label` token is now `#3F4742`. The more-specific dark appraisal-band rule remains unchanged and continues to render light labels on dark surfaces.'
          if '## Base form-label contrast correction — 9 August 2026' not in q:
              q += '\n\n'+note
          qa.write_text(q+'\n',encoding='utf-8')
          PY
      - name: Regenerate manifest and remove QA transport
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('.')
          old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          exclude={'.github/workflows/a11y-all-routes.yml'}
          entries=[]
          for p in sorted(root.rglob('*')):
              rel=p.as_posix()
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or rel in exclude:
                  continue
              b=p.read_bytes(); entries.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={k:old[k] for k in ['release','date','baseRelease','baseSha256'] if k in old}
          manifest['fileCount']=len(entries)+1;manifest['files']=entries
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/a11y-all-routes.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct base form label contrast token'
          git push origin HEAD:cutover/legacy-routing-preview
