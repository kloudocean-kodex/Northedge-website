name: NorthEdge finalize cache-policy candidate
on:
  push:
    branches: [cutover/legacy-routing-preview]
    paths: [.github/workflows/a11y-all-routes.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Record cache-policy fix
        run: |
          python - <<'PY'
          from pathlib import Path
          qa=Path('docs/QA_REPORT.md'); q=qa.read_text(encoding='utf-8').rstrip()
          note='## Mutable asset cache correction — 9 August 2026\n\nDeployment-synchronised accessibility testing exposed stale CSS on the Cloudflare branch alias: a query-busted CSS request returned the new release while normal page loads could reuse the older `/assets/*` response. Mutable CSS and JavaScript now require revalidation (`max-age=0, must-revalidate`). Images, motifs and partner assets use a one-hour revalidation window rather than a seven-day stale window. This prevents source fixes from being masked by stale client assets.'
          if '## Mutable asset cache correction — 9 August 2026' not in q:q += '\n\n'+note
          qa.write_text(q+'\n',encoding='utf-8')
          PY
      - name: Regenerate manifest and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('.');old=json.loads((root/'RELEASE_MANIFEST.json').read_text())
          entries=[]
          for p in sorted(root.rglob('*')):
            rel=p.as_posix()
            if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json' or rel=='.github/workflows/a11y-all-routes.yml':continue
            b=p.read_bytes();entries.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          m={k:old[k] for k in ['release','date','baseRelease','baseSha256'] if k in old};m['fileCount']=len(entries)+1;m['files']=entries
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -f .github/workflows/a11y-all-routes.yml
          rmdir .github/workflows 2>/dev/null || true; rmdir .github 2>/dev/null || true
          git add -A;git diff --cached --check
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize mutable asset cache policy';git push origin HEAD:cutover/legacy-routing-preview
