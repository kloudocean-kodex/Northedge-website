name: NorthEdge checkpoint manifest gate
on:
  push:
    branches:
      - cutover/legacy-routing-preview
    paths:
      - .github/workflows/checkpoint-manifest.yml
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PUBLIC_TREE: 1732a4ffcc54f30764df35a595afe444d6562422
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutover/legacy-routing-preview
          fetch-depth: 0
      - name: Verify deployed public tree unchanged
        run: |
          TREE=$(git rev-parse HEAD:public)
          echo "Public tree: $TREE"
          test "$TREE" = "$EXPECTED_PUBLIC_TREE"
      - name: Remove transport and regenerate release manifest
        run: |
          rm -f .github/workflows/checkpoint-manifest.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.');old=json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'));entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.name=='RELEASE_MANIFEST.json':continue
              b=p.read_bytes();entries.append({'path':p.as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out={k:old.get(k) for k in ['release','baseRelease','baseSha256'] if old.get(k) is not None}
          out['date']='2026-08-10';out['fileCount']=len(entries)+1;out['files']=entries
          assert out['fileCount']==185,out['fileCount']
          (root/'RELEASE_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Final checkpoint release files:',out['fileCount'])
          PY
      - name: Commit clean checkpoint
        run: |
          test "$(git rev-parse HEAD:public)" = "$EXPECTED_PUBLIC_TREE"
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize NorthEdge cutover checkpoint'
          git push origin HEAD:cutover/legacy-routing-preview
